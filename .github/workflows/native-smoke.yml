name: Native smoke

# Native mode cannot be exercised from the runtime container (no systemd, no
# root), so a real install is verified here: install the release tag, assert the
# units, the health probe and the launcher, run the update path from the
# deployment directory, then uninstall. This is the leg that only ever ran on a
# maintainer's host — and the one where a missing launcher went unnoticed for
# several releases.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  schedule:
    # A moving target: a runner image change or an upstream DSH release should
    # not wait for the next tag to be noticed.
    - cron: '17 4 * * 1'

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # setup.sh update resolves release tags and setup.sh fetches them.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Which release to install
        id: release
        # The installer initialises its own git repository and checks out a ref
        # there, so the ref has to exist on the remote: a release tag. A branch
        # run (nightly) tests the latest release instead.
        run: |
          if tag="$(git describe --tags --exact-match 2>/dev/null)"; then
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "on a release tag: $tag"
          else
            tag="$(git describe --tags --abbrev=0)"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
            echo "not on a tag; testing the latest release $tag"
          fi

      - name: Install this release
        # It installs the release under test (the tag this workflow was triggered
        # by), then the update-path run below exercises the same prepare, restart and
        # health path an update takes — from the deployment directory, which is where a
        # real one is run.
        run: sudo -E ./setup.sh --config .github/native-answers.env --yes --ref "${{ steps.release.outputs.ref }}"

      - name: Both services are active
        run: |
          sudo systemctl is-active --quiet dsh.service
          sudo systemctl is-active --quiet dsh-updater.service

      - name: The runtime answers
        run: |
          # The answers file may pin a non-default port; the probe defaults to
          # 4310, so pass what the deployment actually wrote.
          port="$(sed -n 's/^DSH_PORT=//p' /srv/dsh-ci/.env | head -1)"
          for _ in $(seq 1 30); do
            if sudo -E env DSH_PORT="${port:-4311}" /usr/local/bin/dsh-healthcheck; then echo "healthy"; exit 0; fi
            sleep 4
          done
          echo "dsh did not become healthy on port ${port:-4311}"
          sudo journalctl -u dsh.service --no-pager -n 80
          exit 1

      - name: The launcher exists where setup.sh update looks for it
        # The native update path used to run $DEPLOY_DIR/dsh-entrypoint, which no
        # installer creates: every native update failed to prepare and rolled back.
        run: test -x /usr/local/bin/dsh-entrypoint

      - name: An update-path run from the deployment directory
        # The update path runs prepare, restarts the unit and waits for health — the same steps an update runs,
        # including the working directory that made prepare fail.
        run: |
          set -o pipefail
          if ! sudo -E bash -c 'cd /srv/dsh-ci && ASSUME_YES=1 ./setup.sh update' 2>&1 | tee /tmp/plugin.log; then
            echo "::error::setup.sh update failed"; tail -40 /tmp/plugin.log
            sudo journalctl -u dsh.service --no-pager -n 60 || true
            exit 1
          fi
          sudo systemctl is-active --quiet dsh.service

      - name: The plan is readable and idempotent
        run: sudo -E ./setup.sh --check --config .github/native-answers.env

      - name: The updater answers on loopback only
        run: |
          curl -fsS -H "Authorization: Bearer ci-updater-token" http://127.0.0.1:8787/health
          addr="$(ip -4 route get 1.1.1.1 | awk '{for(i=1;i<=NF;i++) if($i=="src"){print $(i+1); exit}}')"
          if curl -fsS -m 3 "http://${addr}:8787/health" >/dev/null 2>&1; then
            echo "updater is reachable on ${addr} — it must stay on loopback"
            exit 1
          fi

      - name: Uninstall removes the units and keeps the data
        run: |
          sudo -E ./setup.sh uninstall --yes --config .github/native-answers.env
          if sudo systemctl is-active --quiet dsh.service; then
            echo "dsh.service is still active after uninstall"
            exit 1
          fi
          test -f /srv/dsh-ci/.env
          test -d /srv/dsh-ci/data/home

      - name: Clean up
        if: always()
        run: |
          sudo systemctl disable --now dsh-updater.service dsh.service || true
          sudo rm -f /etc/systemd/system/dsh.service /etc/systemd/system/dsh-updater.service
          sudo rm -rf /srv/dsh-ci /srv/dsh
