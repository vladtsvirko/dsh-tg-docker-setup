name: Design image

# The MCP bridge is built from source (the upstream registry package is not
# publicly pullable), so the build itself needs a check: a broken Dockerfile or
# a moved upstream commit must fail here, not in someone's living room.
on:
  workflow_dispatch:
  push:
    paths:
      - 'design/**'
      - '.github/workflows/design-image.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the MCP bridge
        run: docker build -f design/mcp.Dockerfile -t dsh-design-mcp:ci design

      - name: It starts and answers /health
        run: |
          docker run -d --name mcp-ci -p 127.0.0.1:3000:3000 \
            -e PENPOT_API_URL=http://127.0.0.1:9 \
            -e PENPOT_ACCESS_TOKEN=ci \
            dsh-design-mcp:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "the bridge did not answer"
          docker logs mcp-ci
          exit 1
