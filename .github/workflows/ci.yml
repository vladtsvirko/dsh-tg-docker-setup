name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The installer test bootstraps from a release tag; a shallow clone has
          # no tags, and the test would skip (or fail) for the wrong reason.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Supervisor tests
        run: node --test supervisor.test.mjs

      - name: Git credentials tests
        run: node --test git-credentials.test.mjs

      - name: Updater tests
        run: node --test updater.test.mjs

      - name: Installer tests
        run: node --test install.test.mjs

      - name: Update-path tests
        run: node --test update.test.mjs

      - name: Git manifest tests
        run: node --test git-manifest.test.mjs

      - name: Doctor and credential tests
        run: node --test repair.test.mjs

      - name: Penpot CLI tests
        run: node --test penpot.test.mjs

      - name: Plugin catalog and version-policy tests
        run: node --test plugins.test.mjs

      - name: Entrypoint plugin-policy tests
        run: node --test entrypoint.test.mjs

      - name: Shell syntax
        run: bash -n entrypoint.sh healthcheck.sh update.sh install.sh scripts/repair.sh

      - name: Scripts and design stack
        run: |
          # The repair script must be executable in the checkout: the installer
          # runs it by path, and a mode bit lost in a release breaks --doctor.
          test -x scripts/repair.sh
          test -x scripts/credentials.mjs
          # The HTTPS front runs it by path, and the compose mounts both files.
          test -x scripts/design-tls.sh
          test -f design/nginx-tls.conf
          # The Penpot stack is the only compose file left.
          cp design/.env.example design/.env
          python3 -c 'import yaml; yaml.safe_load(open("design/compose.yaml"))'

      - name: Validate release tag
        run: node scripts/check-version.mjs

      # Plugins are versioned independently: the catalog is the only place the
      # setup names their versions, and a malformed one breaks a boot.
      - name: Plugin catalog
        run: |
          node -e '
            const catalog = require("./plugins.json")
            for (const [name, entry] of Object.entries(catalog.plugins ?? {})) {
              if (!/^((?:@[^/]+\/)?[^@]+)@\d+\.\d+\.\d+$/.test(entry.spec ?? "")) throw new Error(`${name}: bad npm spec`)
              if (!/^github:[^#]+#v\d+\.\d+\.\d+$/.test(entry.fallback ?? "")) throw new Error(`${name}: bad fallback`)
              if (!/^\d+\.\d+\.\d+/.test(entry.minimum ?? "")) throw new Error(`${name}: bad minimum`)
            }
            console.log(`plugin catalog ok: ${Object.keys(catalog.plugins ?? {}).length} plugins`)
          '
