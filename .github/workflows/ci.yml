name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Supervisor tests
        run: node --test supervisor.test.mjs

      - name: Git credentials tests
        run: node --test git-credentials.test.mjs

      - name: Updater tests
        run: node --test updater.test.mjs

      - name: Shell syntax
        run: bash -n entrypoint.sh healthcheck.sh update.sh host-install/setup-dsh-server.sh

      - name: Compose configuration
        run: cp .env.example .env && docker compose config >/dev/null

      - name: Validate release tag
        run: node scripts/check-version.mjs
