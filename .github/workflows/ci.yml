name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  supervisor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The installer test bootstraps from a release tag; a shallow clone has
          # no tags, and the test would skip (or fail) for the wrong reason.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Supervisor tests
        run: node --test supervisor.test.mjs

      - name: Git credentials tests
        run: node --test git-credentials.test.mjs

      - name: Updater tests
        run: node --test updater.test.mjs

      - name: Installer tests
        run: node --test install.test.mjs

      - name: Update-path tests
        run: node --test update.test.mjs

      - name: Git profile tests
        run: node --test git-profile.test.mjs

      - name: Penpot CLI tests
        run: node --test penpot.test.mjs

      - name: Shell syntax
        run: bash -n entrypoint.sh healthcheck.sh update.sh install.sh host-install/setup-dsh-server.sh

      - name: Compose configuration
        run: |
          cp .env.example .env && docker compose config >/dev/null
          cp design/.env.example design/.env && docker compose --project-directory design -f design/compose.yaml config >/dev/null

      - name: Validate release tag
        run: node scripts/check-version.mjs
