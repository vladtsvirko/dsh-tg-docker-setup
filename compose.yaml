name: dsh

# DeepSeek Harness backend — web UI + Telegram adapter in one container.
#
#   cp .env.example .env      # fill it in
#   docker compose build
#   docker compose up -d
#
# The container is the security boundary: inside it the harness runs
# DSH_PERMISSION_MODE=danger-full-access (no nested sandbox), and everything
# outside /data is invisible. Don't loosen the settings below without a reason.

services:
  # One-shot ownership fix. Docker creates a missing bind-mount source (./data)
  # as root; the runtime runs as DSH_UID and cannot write there, so it would die
  # on `mkdir /data/home`. This container chowns the mount, then exits; it has no
  # network, a read-only rootfs, and only the two capabilities chown needs.
  init:
    image: dsh-backend:0.2.1-rc.2-0.1.3
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        runtime_uid="$$(id -u dsh)"
        runtime_gid="$$(id -g dsh)"
        if [ "$$runtime_uid" != "$$DSH_UID" ] || [ "$$runtime_gid" != "$$DSH_GID" ]; then
          echo "init: the image runs as $$runtime_uid:$$runtime_gid but .env says $$DSH_UID:$$DSH_GID" >&2
          echo "init: rebuild so the runtime user matches: docker compose build" >&2
          exit 1
        fi
        owner="$$(stat -c '%u:%g' /data)"
        if [ "$$owner" != "$$DSH_UID:$$DSH_GID" ]; then
          chown -R "$$DSH_UID:$$DSH_GID" /data
        fi
        mkdir -p /data/home /data/workspace
        chown "$$DSH_UID:$$DSH_GID" /data/home /data/workspace
    environment:
      DSH_UID: ${DSH_UID:-1000}
      DSH_GID: ${DSH_GID:-1000}
    volumes:
      - ./data:/data
      # Optional git credentials: profiles.json, tokens/keys, known_hosts.
      - ./secrets:/run/secrets:ro

    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    restart: "no"

  dsh:
    build:
      context: .
      args:
        DSH_UID: ${DSH_UID:-1000}
        DSH_GID: ${DSH_GID:-1000}
    image: dsh-backend:0.2.1-rc.2-0.1.3
    container_name: dsh
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

    env_file:
      - .env
    environment:
      # HOME must be writable: dsh and pnpm keep state there, and the rootfs is read-only.
      HOME: /data/home
      DSH_HOME: /data/home
      DSH_WORKSPACE: /data/workspace
      DSH_PORT: ${DSH_PORT:-4310}
      # The container is the boundary. A nested bwrap/Landlock sandbox is
      # unreliable in containers and fails closed, which would break the bash tool.
      DSH_PERMISSION_MODE: ${DSH_PERMISSION_MODE:-danger-full-access}

    volumes:
      - ./data:/data
      # Optional git credentials: profiles.json, tokens/keys, known_hosts.
      - ./secrets:/run/secrets:ro

    networks:
      - default
      - ops

    ports:
      # Bind to the LAN address only; 127.0.0.1 keeps it private to the host.
      - "${DSH_BIND_IP:-127.0.0.1}:${DSH_PORT:-4310}:${DSH_PORT:-4310}"

    # --- hardening ---------------------------------------------------------
    read_only: true
    tmpfs:
      # Docker mounts tmpfs with noexec, so the native addon cache cannot live
      # here — the image points NARB_NATIVE_CACHE_DIR at /data/.cache/native.
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${DSH_MEM_LIMIT:-4g}
    cpus: ${DSH_CPUS:-2.0}
    # Never mount /var/run/docker.sock here: that is a root-equivalent escape.

    healthcheck:
      # probes over HTTP with curl --noproxy, then falls back to a TCP connect;
      # 10s interval so `docker compose ps` reflects reality quickly instead of
      # sitting on "starting" for a whole start_period.
      test: ["CMD", "/usr/local/bin/dsh-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Privileged setup updater. No published port: the connector calls it over
  # the internal ops network with a bearer token.
  updater:
    build:
      context: .
      dockerfile: updater.Dockerfile
    image: dsh-updater:0.2.1-rc.2-0.1.3
    restart: unless-stopped
    stop_grace_period: 10s
    user: "${DSH_UID:-1000}:${DSH_GID:-1000}"
    group_add:
      - "${DSH_DOCKER_GID:-999}"
    working_dir: ${PWD}
    environment:
      HOME: /tmp
      DSH_REPO_DIR: ${PWD}
      DSH_DATA_DIR: ${PWD}/data
      DSH_UPDATER_PORT: "8787"
      DSH_UPDATER_TOKEN: ${DSH_UPDATER_TOKEN:-}
      DSH_TELEGRAM_BOT_TOKEN: ${DSH_TELEGRAM_BOT_TOKEN:-}
    volumes:
      # Same absolute path inside the container, so `docker compose` run by the
      # updater resolves ./data to the real host paths.
      - ${PWD}:${PWD}
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8787"
    depends_on:
      init:
        condition: service_completed_successfully
    networks:
      - default
      - ops
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ops:
    internal: true
