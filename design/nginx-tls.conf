# HTTPS front for the Penpot UI.
#
# The design stack is served over plain HTTP on DSH_DESIGN_PORT for the agent
# and the LAN. Browsers only expose navigator.clipboard on a secure origin, so
# the token "Copy" button cannot work there. This sidecar publishes the same
# frontend over TLS on DSH_DESIGN_TLS_PORT; the certificate is signed by the
# deployment's local CA (design/certs/ca.crt), which the operator trusts once.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8443 ssl;
  server_name _;

  ssl_certificate     /certs/server.crt;
  ssl_certificate_key /certs/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 200m;

  location / {
    proxy_pass http://penpot-frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}
