# Optional design stack: Penpot for design work.
#
# Started by setup.sh --design penpot (or by re-running setup.sh later).
# It is a separate compose project on purpose: it has its own lifecycle, its own
# data, and it can be removed without touching the runtime.
#
#   cd design && podman-compose -f compose.yaml up -d
#
# Everything is LAN-only: the frontend is published on DSH_BIND_IP, and the
# runtime reaches it with the `penpot` CLI over that address.
x-penpot: &penpot
  # The backend keeps the HTTP origin: the agent downloads exports from it, and
  # the CLI/plugin already speak HTTP. The frontend overrides this with the
  # HTTPS origin below, so the browser's API calls stay same-origin on :8443.
  PENPOT_PUBLIC_URI: http://${DSH_BIND_IP:-127.0.0.1}:${DSH_DESIGN_PORT:-8090}
  # Penpot prefixes "jdbc:" to this value, so credentials must NOT be in the
  # URI: PGJDBC would treat "user:password@host" as the hostname. They go in
  # the separate PENPOT_DATABASE_USERNAME/PASSWORD variables.
  PENPOT_DATABASE_URI: postgresql://penpot-postgres:5432/penpot
  PENPOT_DATABASE_USERNAME: penpot
  PENPOT_DATABASE_PASSWORD: ${PENPOT_DB_PASSWORD:?set PENPOT_DB_PASSWORD}
  PENPOT_REDIS_URI: redis://penpot-redis:6379/0
  PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set PENPOT_SECRET_KEY}
  # Registration is on so the first account can be created; email verification is
  # off because a LAN instance has no SMTP. Access tokens are what the agent CLI
  # authenticates with.
  PENPOT_FLAGS: >-
    enable-registration
    enable-login-with-password
    disable-email-verification
    enable-access-tokens
  PENPOT_TELEMETRY_ENABLED: "false"

services:
  penpot-postgres:
    image: docker.io/library/postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: ${PENPOT_DB_PASSWORD:?set PENPOT_DB_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [design]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penpot -d penpot"]
      interval: 10s
      timeout: 5s
      retries: 10

  penpot-redis:
    image: docker.io/library/redis:7.2
    restart: unless-stopped
    networks: [design]

  penpot-backend:
    image: docker.io/penpotapp/backend:2.18.6
    restart: unless-stopped
    depends_on:
      penpot-postgres:
        condition: service_healthy
      penpot-redis:
        condition: service_started
    environment:
      <<: *penpot
      PENPOT_ASSETS_STORAGE_BACKEND: assets-fs
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: /opt/data/assets
    volumes:
      - ./data/assets:/opt/data/assets
    networks: [design]

  penpot-exporter:
    image: docker.io/penpotapp/exporter:2.18.6
    restart: unless-stopped
    depends_on: [penpot-redis]
    environment:
      PENPOT_PUBLIC_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-redis:6379/0
      PENPOT_SECRET_KEY: ${PENPOT_SECRET_KEY:?set PENPOT_SECRET_KEY}
      PENPOT_BROWSER_CHROMIUM: "true"
      PENPOT_BROWSER_HEADLESS: "true"
    networks: [design]

  penpot-frontend:
    image: docker.io/penpotapp/frontend:2.18.6
    restart: unless-stopped
    depends_on: [penpot-backend, penpot-exporter]
    environment:
      <<: *penpot
      # The browser must call the origin it was served from, or the API call is
      # a cross-origin/mixed-content request from the HTTPS page to HTTP.
      PENPOT_PUBLIC_URI: https://${DSH_BIND_IP:-127.0.0.1}:${DSH_DESIGN_TLS_PORT:-8443}
    volumes:
      # The backend answers asset requests with X-Accel-Redirect to
      # /internal/assets/..., which the frontend's nginx serves from this
      # directory. The standard Penpot compose mounts the same volume into both
      # containers; without it every export download is a 404 after the
      # redirect lands on an empty directory.
      - ./data/assets:/opt/data/assets:ro
    ports:
      # LAN-only. Never 0.0.0.0: the instance has real accounts.
      - "${DSH_BIND_IP:-127.0.0.1}:${DSH_DESIGN_PORT:-8090}:8080"
    networks: [design]

  # HTTPS front for the browser. The clipboard API is only available on a
  # secure origin, so this is what makes Penpot's token "Copy" button work.
  # The agent keeps using the plain-HTTP port above.
  penpot-tls:
    image: docker.io/library/nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [penpot-frontend]
    volumes:
      - ./nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
    ports:
      - "${DSH_BIND_IP:-127.0.0.1}:${DSH_DESIGN_TLS_PORT:-8443}:8443"
    networks: [design]

networks:
  design:
